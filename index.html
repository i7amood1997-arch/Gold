<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f3ec" />
<meta name="description" content="أسعار الذهب لحظة بلحظة، وحاسبة المصنعية والزكاة." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="عيار" />
<title>عيار · حاسبة الذهب</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png" />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preload" href="fonts/plex-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/plex-arabic-latin-600.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="app.css" />
<script>
  // Before first paint: apply the saved theme so there is no flash.
  try {
    var s = JSON.parse(localStorage.getItem('iyar.settings') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="التنقل"></nav>
</div>
<div id="sheet-root" class="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
